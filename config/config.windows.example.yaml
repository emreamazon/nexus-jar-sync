# Safe Windows example. Copy to config.yaml and replace every placeholder.
# Credential values belong in the named environment variables, never in YAML.
logging:
  level: "INFO"
  file: "logs/nexus-jar-sync.log"
  max_file_size_mb: 5
  backup_count: 3

state:
  directory: "data/state"

tools:
  seven_zip_executable: "C:/Program Files/7-Zip/7z.exe"
  extraction_timeout_seconds: 300

defaults:
  network:
    timeout_seconds: 30
    retries: 3
    retry_delay_seconds: 5
    verify_tls: true
    ca_bundle: null
  auth:
    username_env: "NEXUS_USERNAME"
    password_env: "NEXUS_PASSWORD"
  artifact:
    extension: "jar"
    classifier: null
targets:
# Primary version changes create new complete releases; companion changes alone do not.
  - id: "sample-application"
    enabled: true
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-releases"
      group_id: "org.example.sample"
      artifact_id: "windows-versions"
    release_artifacts:
      - id: "windows-obfuscated"
        artifact_id: "windows-obs"
      - id: "linux"
        artifact_id: "linux-versions"
      - id: "linux-obfuscated"
        artifact_id: "linux-obs"
    destination:
      directory: "C:/NexusJarSync/artifacts/application"
    companions:
      - id: "dependencies"
        url: "https://nexus-one.example.invalid/repository/static/dependencies.7z"
        filename: "dependencies.7z"
        action: "extract_7z"
        keep_archive: false
        extract_to: "."
        strip_single_root: true
      - id: "license"
        url: "https://nexus-one.example.invalid/repository/static/license.txt"
        filename: "license.txt"
        action: "copy"

  - id: "sample-independent-tool"
    enabled: true
    nexus:
      url: "https://nexus-two.example.invalid"
      repository: "tool-releases"
      group_id: "org.example.tool"
      artifact_id: "independent-tool"
    auth:
      username_env: "TOOLS_NEXUS_USERNAME"
      password_env: "TOOLS_NEXUS_PASSWORD"
    network:
      timeout_seconds: 15
      retries: 1
    destination:
      directory: "D:/ManagedArtifacts/independent-tool"

  - id: "sample-disabled"
    enabled: false
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-snapshots"
      group_id: "org.example.optional"
      artifact_id: "optional-component"
    destination:
      directory: "C:/NexusJarSync/artifacts/optional"
