# Safe Windows example. Copy to config.yaml and replace every placeholder.
# Credential values belong in the named environment variables, never in YAML.
logging:
  level: "INFO"
  file: "logs/nexus-jar-sync.log"
  max_file_size_mb: 5
  backup_count: 3

state:
  directory: "data/state"

defaults:
  network:
    timeout_seconds: 30
    retries: 3
    retry_delay_seconds: 5
    verify_tls: true
    ca_bundle: null
  auth:
    username_env: "NEXUS_USERNAME"
    password_env: "NEXUS_PASSWORD"
  artifact:
    extension: "jar"
    classifier: null
  target:
    keep_previous_versions: 1

targets:
  - id: "sample-application"
    enabled: true
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-releases"
      group_id: "org.example.sample"
      artifact_id: "sample-application"
    destination:
      directory: "C:/NexusJarSync/artifacts/application"

  - id: "sample-tools-bundle"
    enabled: true
    nexus:
      url: "https://nexus-two.example.invalid"
      repository: "tools-releases"
      group_id: "org.example.tools"
      artifact_id: "tools-bundle"
    auth:
      username_env: "TOOLS_NEXUS_USERNAME"
      password_env: "TOOLS_NEXUS_PASSWORD"
    artifact:
      classifier: "all"
    network:
      timeout_seconds: 15
      retries: 1
    destination:
      directory: "D:/ManagedJars/tools"
    target:
      keep_previous_versions: 3

  - id: "sample-disabled"
    enabled: false
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-snapshots"
      group_id: "org.example.optional"
      artifact_id: "optional-component"
    destination:
      directory: "C:/NexusJarSync/artifacts/optional"
