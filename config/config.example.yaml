# Portable relative-path example. Platform-specific examples are alongside this file.
# Copy one example to config/config.yaml and replace the placeholder values.
# Credentials are read from environment variables and must never be placed here.
logging:
  level: "INFO"
  file: "logs/nexus-jar-sync.log"
  max_file_size_mb: 5
  backup_count: 3

state:
  directory: "data/state"

# Replace with the exact 7-Zip executable path for this host.
tools:
  seven_zip_executable: "REVIEW-AND-SET-ABSOLUTE-7Z-PATH"
  extraction_timeout_seconds: 300

defaults:
  network:
    timeout_seconds: 30
    retries: 3
    retry_delay_seconds: 5
    verify_tls: true
    ca_bundle: null

  auth:
    username_env: "NEXUS_USERNAME"
    password_env: "NEXUS_PASSWORD"

  artifact:
    extension: "jar"
    classifier: null

targets:
# The primary Maven version is the sole trigger. Fixed companions are fetched
# only while assembling a new append-only primary release.
  - id: "example-application"
    enabled: true
    nexus:
      url: "https://nexus-one.example.invalid/"
      repository: "sample-releases"
      group_id: "org.example.sample"
      artifact_id: "windows-versions"
    # Secondary artifacts inherit Nexus/auth/network/extension/classifier and
    # are resolved at exactly the primary version; they never trigger releases.
    release_artifacts:
      - id: "windows-obfuscated"
        artifact_id: "windows-obs"
      - id: "linux"
        artifact_id: "linux-versions"
      - id: "linux-obfuscated"
        artifact_id: "linux-obs"
    destination:
      directory: "artifacts/sample-application"
    companions:
      - id: "dependencies"
        url: "https://nexus-one.example.invalid/repository/static/dependencies.7z"
        filename: "dependencies.7z"
        action: "extract_7z"
        keep_archive: false
        extract_to: "."
        strip_single_root: true
      - id: "license"
        url: "https://nexus-one.example.invalid/repository/static/license.txt"
        filename: "license.txt"
        action: "copy"

  - id: "example-independent-tool"
    enabled: true
    nexus:
      url: "https://nexus-two.example.invalid"
      repository: "tool-releases"
      group_id: "org.example.tool"
      artifact_id: "independent-tool"
    auth:
      username_env: "LIBRARY_NEXUS_USERNAME"
      password_env: "LIBRARY_NEXUS_PASSWORD"
    network:
      timeout_seconds: 10
      retries: 1
    destination:
      directory: "artifacts/independent-tool"

  - id: "example-disabled"
    enabled: false
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-snapshots"
      group_id: "org.example.optional"
      artifact_id: "optional-component"
    destination:
      directory: "artifacts/optional-component"
