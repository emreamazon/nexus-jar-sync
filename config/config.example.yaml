# Portable relative-path example. Platform-specific examples are alongside this file.
# Copy one example to config/config.yaml and replace the placeholder values.
# Credentials are read from environment variables and must never be placed here.
logging:
  level: "INFO"
  file: "logs/nexus-jar-sync.log"
  max_file_size_mb: 5
  backup_count: 3

state:
  directory: "data/state"

defaults:
  network:
    timeout_seconds: 30
    retries: 3
    retry_delay_seconds: 5
    verify_tls: true
    ca_bundle: null

  auth:
    username_env: "NEXUS_USERNAME"
    password_env: "NEXUS_PASSWORD"

  artifact:
    extension: "jar"
    classifier: null

targets:
# Every required Nexus file is an independent target. Matching versions below
# share the same base/version directory without being grouped transactionally.
  - id: "example-application"
    enabled: true
    nexus:
      url: "https://nexus-one.example.invalid/"
      repository: "sample-releases"
      group_id: "org.example.sample"
      artifact_id: "sample-application"
    destination:
      directory: "artifacts/sample-application"

  - id: "example-application-dependencies"
    enabled: true
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-releases"
      group_id: "org.example.sample"
      artifact_id: "sample-application"
    auth:
      username_env: "LIBRARY_NEXUS_USERNAME"
      password_env: "LIBRARY_NEXUS_PASSWORD"
    artifact:
      classifier: "dependencies"
    network:
      timeout_seconds: 10
      retries: 1
    destination:
      directory: "artifacts/sample-application"

  - id: "example-disabled"
    enabled: false
    nexus:
      url: "https://nexus-one.example.invalid"
      repository: "sample-snapshots"
      group_id: "org.example.optional"
      artifact_id: "optional-component"
    destination:
      directory: "artifacts/optional-component"
